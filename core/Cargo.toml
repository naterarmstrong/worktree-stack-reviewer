[package]
name = "wt-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
gix = { version = "0.89", default-features = false, features = [
  "sha1",
  "max-performance-safe",
  "basic",
  "status",
  "dirwalk",
  "attributes",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
strip = true
