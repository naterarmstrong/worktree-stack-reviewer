<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- A stack of two branches forks off main, and each merges back into main, which runs upward. -->
  <!-- Main: a ring at the bottom-left and a line up to an arrowhead at the top. -->
  <circle cx="4.75" cy="19.25" r="2"/>
  <path d="M4.75 17.25V2.75"/>
  <path d="M3 4.5L4.75 2.75L6.5 4.5"/>
  <!-- Fork: leaves main's ring to the right, turns up through a 2px arc, and runs straight into the lower stack ring. -->
  <path d="M6.75 19.25H17.25a2 2 0 0 0 2-2V15.75"/>
  <!-- Stack: two rings joined by a short line. -->
  <circle cx="19.25" cy="13.75" r="2"/>
  <circle cx="19.25" cy="7.25" r="2"/>
  <path d="M19.25 9.25V11.75"/>
  <!-- Each stack ring merges left into main, stopping 2px short of its line. -->
  <path d="M17.25 7.25H8.25"/>
  <path d="M10 5.5L8.25 7.25L10 9"/>
  <path d="M17.25 13.75H8.25"/>
  <path d="M10 12L8.25 13.75L10 15.5"/>
</svg>
